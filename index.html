<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Anderson Peterkin's Notes</title>
<style>body{font-family:Arial,sans-serif;background:#f3f7f5;color:#19392b;margin:0;padding:40px}.box{max-width:650px;margin:auto;background:white;padding:30px;border-radius:14px;box-shadow:0 5px 22px #0001}h1{color:#17643e}form.add{display:flex;gap:8px}input{flex:1;padding:12px;border:1px solid #b9c9c0;border-radius:6px}button{background:#17643e;color:white;border:0;border-radius:6px;padding:12px;cursor:pointer}li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding:12px 0;gap:12px}.delete{background:#a32929}</style></head>
<body><main class="box"><h1>Notes for Anderson Peterkin</h1><p>Add, view, and delete notes.</p><form class="add" method="POST"><input name="content" placeholder="Write a note..." required maxlength="500"><button>Add Note</button></form><ul>{% for note in notes %}<li><span>{{ note[1] }}</span><form action="{{ url_for('delete', note_id=note[0]) }}" method="POST"><button class="delete">Delete</button></form></li>{% else %}<li>No notes yet.</li>{% endfor %}</ul></main></body></html>
